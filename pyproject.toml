# Solo configura las herramientas de desarrollo. El proyecto no se instala como paquete.
[tool.ruff]
line-length = 120
# scraper/ y analytics/ corren en el Python del sistema, 3.9 o mayor.
target-version = "py39"
extend-exclude = [".venv", "data", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
# El largo de 120 es una guía. El repo agrupa pasos cortos con `;` a propósito.
ignore = ["E501", "E702"]

[tool.ruff.lint.per-file-ignores]
# Las páginas hacen `from ui.common import *` a propósito. Ver AGENTS.md §6.
"views/*.py" = ["F403", "F405"]
# Importa analytics/ después de `sys.path.insert` y reexporta nombres para las páginas.
"ui/common.py" = ["E402", "F401"]
"app.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
