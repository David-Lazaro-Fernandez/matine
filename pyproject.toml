# Solo configura las herramientas de desarrollo. El proyecto no se instala como paquete.
[tool.ruff]
line-length = 120
# scraper/ y analytics/ corren en el Python del sistema, 3.9 o mayor.
target-version = "py39"
# Los worktrees de los agentes son copias del repo, con cambios a medias.
extend-exclude = [".venv", "data", "docs", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
# El largo de 120 es una guía. El repo agrupa pasos cortos con `;` a propósito.
ignore = ["E501", "E702"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
