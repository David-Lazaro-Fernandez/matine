# Pruebas y build del dashboard en cada push a main y en cada pull request. Si pasan en main, `stable` apunta a un commit
# encima de ese con `dashboard/out/` (el build estático que sirve Caddy): es lo que el servidor despliega en los siguientes
# 15 min (deploy/update.sh). El build va en git porque el servidor no tiene Node y ya trae `stable` con `git fetch`.
# Si algo falla, `stable` no se mueve y el commit queda en rojo. La rama `stable` la mueve solo este workflow.
name: pruebas y commit estable

on:
  push:
    branches: [main]
  pull_request:

# El trabajo mueve la rama stable.
permissions:
  contents: write

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: venv del dashboard y de la API
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt -r requirements-dev.txt

      - name: make check (igual que el pre-push)
        # Sin data/snapshots.db, las pruebas usan la captura grabada.
        run: make check

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: build del dashboard (revisa los tipos)
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: marcar commit estable con el build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dashboard/out
          git commit -q -m "Build del dashboard para ${GITHUB_SHA}"
          git push --force origin "HEAD:refs/heads/stable"
          echo "stable -> $(git rev-parse HEAD) (build de ${GITHUB_SHA})"
